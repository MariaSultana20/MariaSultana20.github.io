# Builds the site and publishes it to GitHub Pages on every push to main.
# Like Xcode Cloud: a fresh machine checks out the code, installs dependencies,
# builds, then uploads the result (dist/) to https://mariasultana20.github.io
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual run from the Actions tab

# The minimum permissions GitHub Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes happen quickly, finish the running deploy and skip the stale queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Vite 8 needs Node 20.19+ or 22.12+
          cache: npm

      # npm ci installs the exact versions from package-lock.json (like Package.resolved).
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
