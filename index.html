<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maria Sultana — iOS Engineer</title>

    <!-- Favicons: browsers use the SVG; older ones fall back to the PNG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />

    <!-- Self-hosted fonts (see src/styles/fonts.css). "preload" starts downloading them
         straight away, before the CSS that uses them has even been read. -->
    <link rel="preload" href="/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- React renders the whole app inside this one div (see src/main.jsx). -->

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
