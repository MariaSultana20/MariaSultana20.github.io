<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maria Sultana — iOS Engineer</title>
    <meta
      name="description"
      content="Software engineer with 1+ year of production iOS experience building Samsung SmartThings features. Swift, UIKit, SwiftUI, TDD and modern concurrency, with strong algorithms foundations from 1,600+ solved problems and ICPC competition."
    />
    <meta name="author" content="Maria Sultana" />
    <!-- The one official address of this page, so search engines don't index duplicates. -->
    <link rel="canonical" href="https://mariasultana20.github.io/" />
    <!-- Colours the browser's address bar on phones (like a tint colour). -->
    <meta name="theme-color" content="#050c14" />

    <!-- Open Graph: the preview card LinkedIn, Facebook, Slack, WhatsApp… show when the link is shared.
         og:image must be a full URL, not a path. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Maria Sultana" />
    <meta property="og:url" content="https://mariasultana20.github.io/" />
    <meta property="og:title" content="Maria Sultana — iOS Engineer" />
    <meta
      property="og:description"
      content="iOS software engineer building Samsung SmartThings. Swift, UIKit, SwiftUI and TDD; ICPC competitor with 1,600+ solved problems."
    />
    <meta property="og:image" content="https://mariasultana20.github.io/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Maria Sultana, iOS Software Engineer" />

    <!-- Twitter / X card: same idea, its own tag names. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Maria Sultana — iOS Engineer" />
    <meta
      name="twitter:description"
      content="iOS software engineer building Samsung SmartThings. Swift, UIKit, SwiftUI and TDD; ICPC competitor with 1,600+ solved problems."
    />
    <meta name="twitter:image" content="https://mariasultana20.github.io/og-image.jpg" />
    <meta name="twitter:image:alt" content="Maria Sultana, iOS Software Engineer" />

    <!-- Structured data: tells search engines this page is about a person, and links her profiles. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Maria Sultana",
        "url": "https://mariasultana20.github.io/",
        "image": "https://mariasultana20.github.io/images/profile-480.jpg",
        "jobTitle": "iOS Software Engineer",
        "worksFor": { "@type": "Organization", "name": "Samsung R&D Institute Bangladesh" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Military Institute of Science and Technology (MIST)" },
        "address": { "@type": "PostalAddress", "addressLocality": "Dhaka", "addressCountry": "BD" },
        "sameAs": [
          "https://github.com/MariaSultana20",
          "https://www.linkedin.com/in/mariasultana20/",
          "https://codeforces.com/profile/Maria_Sultana",
          "https://www.codechef.com/users/maria_sultana",
          "https://leetcode.com/u/Maria_Sultana/"
        ]
      }
    </script>

    <!-- Favicons: browsers use the SVG; older ones fall back to the PNG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Self-hosted fonts (see src/styles/fonts.css). "preload" starts downloading them
         straight away, before the CSS that uses them has even been read. -->
    <link rel="preload" href="/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- React renders the whole app inside this one div (see src/main.jsx). -->
    <div id="root"></div>
    <!-- Shown only if JavaScript is turned off, since React builds the rest of the page with JS. -->
    <noscript>
      <p style="padding: 24px; font-family: sans-serif; color: #ccd6f6; background: #050c14">
        Maria Sultana — iOS Software Engineer. This site needs JavaScript. Contact:
        <a href="mailto:mariasultanaprofessional@gmail.com" style="color: #64ffda">mariasultanaprofessional@gmail.com</a>
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
