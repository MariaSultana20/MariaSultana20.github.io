<!doctype html>
<!--
  Source for public/og-image.png, the 1200×630 preview card shown when the site link
  is shared (LinkedIn, X, Slack…). Regenerate it with:  npm run og-image
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('../public/fonts/inter-latin-wght.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../public/fonts/jetbrains-mono-latin-wght.woff2') format('woff2');
        font-weight: 100 800;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 0 88px;
        background:
          radial-gradient(circle at 85% 20%, rgba(100, 255, 218, 0.14), transparent 45%),
          radial-gradient(circle at 10% 90%, rgba(100, 255, 218, 0.08), transparent 40%),
          #050c14;
        color: #ccd6f6;
        font-family: 'Inter', sans-serif;
      }
      /* A few faint "stars", echoing the hero background. */
      .stars { position: absolute; inset: 0; }
      .stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #ccd6f6; opacity: 0.35; }
      .text { position: relative; flex: 1; }
      .badge {
        display: inline-block;
        font-family: 'JetBrains Mono', monospace;
        font-size: 30px;
        font-weight: 500;
        color: #64ffda;
        border: 3px solid #64ffda;
        border-radius: 12px;
        padding: 2px 16px;
        margin-bottom: 36px;
      }
      h1 { font-size: 84px; font-weight: 700; line-height: 1.05; letter-spacing: -1px; }
      .title { margin-top: 18px; font-size: 38px; font-weight: 600; color: #64ffda; }
      .sub { margin-top: 14px; font-size: 24px; color: #8892b0; white-space: nowrap; }
      .url { margin-top: 44px; font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #8892b0; }
      .photo {
        position: relative;
        width: 300px;
        height: 375px;
        border-radius: 24px;
        border: 4px solid #64ffda;
        box-shadow: 0 0 60px rgba(100, 255, 218, 0.3);
        background: url('../public/images/profile-480.jpg') center / cover;
        flex-shrink: 0;
      }
      .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: #64ffda; }
    </style>
  </head>
  <body>
    <div class="stars">
      <i style="left: 6%; top: 12%"></i><i style="left: 22%; top: 7%"></i><i style="left: 41%; top: 15%"></i>
      <i style="left: 58%; top: 6%"></i><i style="left: 67%; top: 88%"></i><i style="left: 33%; top: 92%"></i>
      <i style="left: 12%; top: 70%"></i><i style="left: 49%; top: 80%"></i><i style="left: 96%; top: 60%"></i>
      <i style="left: 90%; top: 92%"></i><i style="left: 3%; top: 40%"></i><i style="left: 62%; top: 30%"></i>
    </div>
    <div class="text">
      <p class="badge">MS</p>
      <h1>Maria Sultana</h1>
      <p class="title">iOS Software Engineer</p>
      <p class="sub">Samsung SmartThings · ICPC · 1,600+ problems solved</p>
      <p class="url">mariasultana20.github.io</p>
    </div>
    <div class="photo" role="img" aria-label="Maria Sultana"></div>
    <div class="bar"></div>
  </body>
</html>
